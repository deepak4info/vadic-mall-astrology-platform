version: '3.8'

services:
  api:
    build:
      context: ./VadicMall
      dockerfile: Dockerfile
    ports:
      - "5080:5080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5080
      - ConnectionStrings__DefaultConnection=Data Source=/data/vadicmall.db
      - Jwt__Secret=VadicMallSuperSecretKey2026ForJWTAuth!
      - Jwt__Issuer=VadicMallApi
      - Jwt__Audience=VadicMallClient
      - Cors__Origins__0=http://localhost:4318
      - Cors__Origins__1=http://127.0.0.1:4318
    volumes:
      - vadic-data:/data

  ui:
    build:
      context: ./vadic-mall-ui
      dockerfile: Dockerfile
    ports:
      - "4318:4318"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5080/api
    depends_on:
      - api

volumes:
  vadic-data:
